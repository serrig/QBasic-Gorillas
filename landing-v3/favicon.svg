<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="3" fill="#0000AA"/>
  <!-- raised throwing arm + banana -->
  <rect x="12" y="1" width="2" height="2" fill="#FFD23F"/>
  <rect x="12" y="3" width="2" height="4" fill="#8B4513"/>
  <!-- headband -->
  <rect x="5" y="2" width="6" height="1" fill="#00AAAA"/>
  <!-- head -->
  <rect x="5" y="3" width="6" height="3" fill="#8B4513"/>
  <rect x="6" y="4" width="4" height="2" fill="#E2B184"/>
  <rect x="6" y="4" width="1" height="1" fill="#000"/>
  <rect x="9" y="4" width="1" height="1" fill="#000"/>
  <!-- body -->
  <rect x="3" y="6" width="9" height="6" fill="#8B4513"/>
  <rect x="5" y="7" width="5" height="4" fill="#D2B48C"/>
  <!-- left arm -->
  <rect x="2" y="7" width="1" height="5" fill="#8B4513"/>
  <!-- legs -->
  <rect x="4" y="12" width="3" height="2" fill="#8B4513"/>
  <rect x="8" y="12" width="3" height="2" fill="#8B4513"/>
</svg>
